media_library:
  name: cloudinary
  config:
    cloud_name: dcktmxuxu
    api_key: 193492779374426
    upload_preset: travel-portal

backend:
  name: git-gateway
  branch: master

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: japan-days
    label: Japan 2026 — Itinerary Days
    folder: src/content/trips/japan-2026/days
    create: false
    extension: md
    format: frontmatter
    fields:
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Location, name: location, widget: string }
      - { label: Day Title, name: title, widget: string, required: false }
      - { label: Notes, name: notes, widget: text, required: false }
      - label: Accommodation
        name: accommodation
        widget: object
        required: false
        fields:
          - { label: Hotel Name, name: name, widget: string }
          - { label: URL, name: url, widget: string, required: false }
          - { label: "Room Type (private)", name: room_type, widget: string, required: false }
          - { label: "Confirmation (private)", name: confirmation, widget: string, required: false }
      - label: Activities
        name: activities
        widget: list
        default: []
        fields:
          - { label: ID, name: id, widget: string }
          - { label: Time, name: time, widget: string, required: false }
          - { label: Name, name: name, widget: string }
          - { label: Description, name: description, widget: text, required: false }
          - { label: URL, name: url, widget: string, required: false }
          - { label: Photo URL, name: photo, widget: string, required: false }
          - { label: "Confirmation (private)", name: confirmation, widget: string, required: false }
          - { label: "Private Note", name: private_note, widget: string, required: false }
      - label: Meals
        name: meals
        widget: list
        default: []
        fields:
          - { label: ID, name: id, widget: string }
          - { label: Time, name: time, widget: string, required: false }
          - { label: Restaurant, name: restaurant, widget: string }
          - { label: Dish, name: dish, widget: string, required: false }
          - { label: Notes, name: notes, widget: text, required: false }
          - { label: URL, name: url, widget: string, required: false }
          - { label: "Confirmation (private)", name: confirmation, widget: string, required: false }
      - { label: "Day Notes (markdown)", name: body, widget: markdown, required: false }

  - name: diary
    label: Journal
    folder: src/content/trips
    path: "{{trip}}/diary/{{date}}"
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Trip
        name: trip
        widget: select
        options: [japan-2026, helsinki-tallinn-2026]
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - { label: Location, name: location, widget: string }
      - { label: Title, name: title, widget: string, required: false }
      - label: Photos
        name: photos
        widget: list
        required: false
        field: { label: Photo, name: photo, widget: image }
      - { label: Entry, name: body, widget: markdown }
